const N_DIAS = 31;

// Motivo pelo qual o horário NÃO serve (ou null se está livre)
function conflito(pid, sid, d, h, ignoreId) {
  const p = PF[pid], s = SV(sid);
  if (!s) return 'serviço inexistente';
  if (!s.profs.includes(pid)) return p.nome + ' não faz ' + s.nome;
  if (!trabalha(pid, d)) return p.nome + ' está de folga';
  const e = h + s.dur / 60;
  if (h < p.h0 || e > p.h1) return 'fora do expediente de ' + p.nome;
  if (h < ALMOCO[1] && ALMOCO[0] < e) return 'horário de almoço';
  const c = S.appts.find((a) => a.id !== ignoreId && a.p === pid && a.d === d && ativo(a) && h < fim(a) && a.h < e);
  if (c) return 'choca com ' + c.cliente + ' (' + hh(c.h) + ')';
  return null;
}
function livres(pid, sid, d, ignoreId) {
  const s = SV(sid), out = [];
  if (!s) return out;
  for (let h = AG_INI; h + s.dur / 60 <= AG_FIM; h += 0.5) if (!conflito(pid, sid, d, h, ignoreId)) out.push(h);

}

  const sob = ['A.', 'B.', 'C.', 'D.', 'F.', 'G.', 'L.', 'M.', 'N.', 'P.', 'R.', 'S.', 'T.', 'V.'];
  let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let d = 0; d < N_DIAS; d++) {
    if (d === D0) continue;
    PROFS.forEach((p) => {
      if (!trabalha(p.id, d)) return;
      const servs = SA().filter((s) => s.profs.includes(p.id));
      const n = Math.floor(rnd() * (d < 8 ? 4 : 3));
      for (let k = 0; k < n; k++) {
        const s = servs[Math.floor(rnd() * servs.length)];
        const sl = livres(p.id, s.id, d);
        if (!sl.length) continue;
        S.appts.push({ id: 'g' + d + p.id + k, p: p.id, d, h: sl[Math.floor(rnd() * sl.length)], s: s.id, cliente: nomes[Math.floor(rnd() * nomes.length)] + ' ' + sob[Math.floor(rnd() * sob.length)], status: rnd() < 0.4 ? 'confirmado' : 'agendado', metodo: null, orig: rnd() < 0.55 ? 'link' : 'rec' });

})();

/* ================= LEMBRETES (WhatsApp) ================= */

const soDig = (f) => String(f || '').replace(/\D/g, '');
const aConfirmar = (a) => a.status === 'agendado' || a.status === 'confirmado';
const lemPendentes = (d) => S.appts.filter((a) => a.d === d && a.status === 'agendado' && !a.lem).length;
function lembreteMsg(a) {
  const d = DIAS[a.d], s = SV(a.s);
  const quando = (a.d === 0 ? 'Hoje, ' : a.d === 1 ? 'Amanhã, ' : '') + d.longo.replace(/^./, (c) => a.d <= 1 ? c.toLowerCase() : c);
  return 'Oi, ' + a.cliente.split(' ')[0] + '! 💜\n\n' +
    'Passando para lembrar do seu horário no *' + SALAO + '*:\n\n' +
    '• ' + s.nome + ' com ' + PF[a.p].nome + '\n' +
    '• ' + quando + ' às ' + hh(a.h) + '\n\n' +

    'Responda *2* se precisar remarcar 📅\n\n' +
    'Até lá!';
}
function lembreteHref(a) { const n = soDig(foneDe(a)); return 'https://wa.me/' + (n.length >= 10 ? '55' + n : '') + '?text=' + encodeURIComponent(lembreteMsg(a)); }
function lemChip(a) {
  if (a.status === 'confirmado') return '<span class="tag" style="background:#CFE8E1;color:#0F4A42">Confirmou</span>';
  if (a.lem === 'remarcar') return '<span class="tag" style="background:#F8DCC8;color:#7A3310">Quer remarcar</span>';
  if (a.lem === 'enviado') return '<span class="tag" style="background:#EBD9E6;color:#4A1D42">Lembrete enviado · aguardando</span>';

}
function vLembretes() {
  const d = S.lemD;
  const lista = S.appts.filter((a) => a.d === d && aConfirmar(a)).sort((a, b) => a.h - b.h || PI[a.p] - PI[b.p]);

  const env = lista.filter((a) => a.lem || a.status === 'confirmado').length;
  const falta = lista.filter((a) => a.status === 'agendado' && !a.lem).length;
  const rem = lista.filter((a) => a.lem === 'remarcar' && a.status !== 'confirmado').length;

    const s = SV(a.s), ok = a.status === 'confirmado', semFone = soDig(a.fone).length < 10;
    return `<div class="lem">
      <div style="display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:0">
        <div class="lemh">${hh(a.h)}</div>
        <div style="min-width:0"><div style="font-size:15px;font-weight:700">${esc(a.cliente)}</div><div class="sub">${esc(s.nome)} · ${PF[a.p].nome}</div><div style="margin-top:6px">${lemChip(a)}</div></div>
      </div>
      <label class="f" style="flex:1 1 170px;max-width:220px;font-size:12px">WhatsApp<input type="tel" inputmode="tel" data-fone="${a.id}" value="${esc(foneDe(a))}" placeholder="(43) 99999-9999" style="height:40px;font-size:14px"></label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;flex:1 1 260px;justify-content:flex-end">
        ${ok ? `<button class="btn2" style="height:40px" data-a="lemDesf" data-v="${a.id}">Desfazer</button>` : `
          <button class="btnwa" style="height:40px" data-a="lemEnviar" data-v="${a.id}" title="${semFone ? 'Sem número: o WhatsApp abre para você escolher o contato' : ''}">${WA}${a.lem ? 'Reenviar' : 'Enviar lembrete'}</button>
          ${a.lem ? `<button class="btn" style="height:40px;padding:0 14px" data-a="lemConf" data-v="${a.id}">Respondeu 1 · Confirmou</button><button class="btn2" style="height:40px;padding:0 14px" data-a="lemRemarcar" data-v="${a.id}">Respondeu 2 · Remarcar</button>` : ''}`}
      </div></div>`;

  return `<main>
    <header class="top"><div><div class="sub">${DIAS[d].longo}${d === 1 ? ' · amanhã' : d === 0 ? ' · hoje' : ''}</div><h1>Lembretes no WhatsApp</h1></div>

      <div class="kpi"><div class="kl">Confirmaram</div><div class="kv" style="color:#145C52">${conf}</div><div class="ks">${lista.length ? Math.round(conf / lista.length * 100) : 0}% do dia</div></div>

      <div class="sub" style="margin-top:4px">Próxima etapa: com a API oficial do WhatsApp e um servidor, o lembrete vai sair sozinho no dia anterior, e a resposta 1 ou 2 vai atualizar a agenda sem ninguém tocar em nada.</div>

/* ================= ESCALA ================= */
function vEscala() {
  const m = isM();
  const cell = (p, ri, di) => { const on = S.grade[ri][di]; return `<button data-a="esc" data-v="${ri},${di}" aria-label="${p.nome}, ${DIAS_ESC[di]}: ${on ? 'trabalha' : 'folga'}" style="width:100%;min-height:${m ? 48 : 56}px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;${on ? 'background:#F1E6EE;color:#4A1D42;border:1px solid #E2CCDC' : 'background:#FAF8F6;color:#6B6470;border:1px dashed #DDD7D0'}">${m ? `<span style="font-size:11px;font-weight:600">${DIAS_ESC[di]}</span><span style="font-size:10px">${on ? 'trab.' : 'folga'}</span>` : `<span style="font-size:13px;font-weight:600">${on ? hh(p.h0).slice(0, 2) + '–' + hh(p.h1).slice(0, 2) : 'Folga'}</span><span style="font-size:11px">${on ? 'almoço 12–13' : '—'}</span>`}</button>`; };
  const horas = (p, ri) => S.grade[ri].reduce((t, x) => t + x, 0) * (p.h1 - p.h0 - 1);
  let corpo;
  if (m) {
    corpo = PROFS.map((p, ri) => `<div class="mcard"><div style="display:flex;align-items:center;gap:10px"><div class="av">${p.ini}</div><div style="flex:1"><b>${p.nome}</b><div class="sub">${p.func} · ${hh(p.h0)}–${hh(p.h1)} · ${horas(p, ri)}h/semana</div></div></div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">${DIAS_ESC.map((_, di) => cell(p, ri, di)).join('')}</div></div>`).join('');
    corpo = `<div style="display:flex;flex-direction:column;gap:12px">${corpo}</div>`;
  } else {
    const cols = 'grid-template-columns:220px repeat(7,minmax(0,1fr)) 110px';
    corpo = `<section class="card scroll" style="padding:0"><div style="min-width:900px">
      <div style="display:grid;${cols};border-bottom:1px solid #ECE7E1;font-size:12px;font-weight:600;color:#6B6470"><div style="padding:14px 18px">Profissional</div>${DIAS_ESC.map((d) => `<div style="padding:14px 6px;text-align:center">${d}</div>`).join('')}<div style="padding:14px 12px;text-align:right">Horas/semana</div></div>
      ${PROFS.map((p, ri) => `<div style="display:grid;${cols};border-bottom:1px solid #F0ECE7;align-items:center"><div style="padding:12px 18px;display:flex;align-items:center;gap:10px"><div class="av">${p.ini}</div><div><div style="font-size:14px;font-weight:600">${p.nome}</div><div style="font-size:12px;color:#6B6470">${p.func} · comissão ${Math.round(p.com * 100)}%</div></div></div>${DIAS_ESC.map((_, di) => `<div style="padding:6px 4px">${cell(p, ri, di)}</div>`).join('')}<div style="padding:12px;text-align:right;font-size:14px;font-weight:600">${horas(p, ri)}h</div></div>`).join('')}
      <div style="display:grid;${cols};background:#FAF8F6;font-size:12px;color:#4A4550"><div style="padding:14px 18px;font-weight:600">Na equipe no dia</div>${DIAS_ESC.map((_, di) => `<div style="padding:14px 6px;text-align:center;font-weight:600">${S.grade.reduce((t, r) => t + r[di], 0)} de ${PROFS.length}</div>`).join('')}<div></div></div>
    </div></section>`;
  }
  return `<main>
    <header class="top"><div><div class="sub">Escala semanal</div><h1>Escala da equipe</h1></div></header>
    ${toastHtml()}
    <p style="margin:0;font-size:13px;color:#4A4550">Toque num dia para alternar entre trabalho e folga. A agenda e o link de agendamento obedecem a escala na hora. Se já houver cliente marcada no dia, a folga não é aplicada.</p>
    ${corpo}</main>`;
}

/* ================= DADOS SALVOS NESTE APARELHO ================= */
// Tudo fica no navegador (localStorage). Datas são guardadas como data real (AAAA-MM-DD)
// e, ao abrir, viram "dias a partir de hoje". O que já passou vai para o histórico da cliente.
const LS_DADOS = 'salao-cristina-dados-v1', LS_SESSAO = 'salao-cristina-sessao-v1';
const isoDe = (dt) => dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
const diasAte = (iso) => Math.round((new Date(iso + 'T00:00:00') - HOJE) / 86400000);
function pacoteDados() {
  return {
    v: 1, app: 'salao-cristina', salvoEm: new Date().toISOString(),
    servs: S.servs, grade: S.grade, sent: S.sent, users: S.users,
    appts: S.appts.map(({ d, ...r }) => ({ ...r, iso: isoDe(DIAS[d].dt) })),
    clientes: S.clientes.map((c) => ({ ...c, hist: c.hist.map(({ dias, ...r }) => ({ ...r, iso: isoDe(dataDias(-dias)) })) }))
  };
}
function salvarDados() {
  try { localStorage.setItem(LS_DADOS, JSON.stringify(pacoteDados())); S.salvoEm = new Date(); S.semSalvar = false; }
  catch (e) { S.semSalvar = true; }
}
function aplicarDados(dados) {
  S.servs = dados.servs; S.grade = dados.grade; S.sent = dados.sent || {}; S.users = dados.users && dados.users.length ? dados.users : usuariosPadrao();
  S.clientes = (dados.clientes || []).map(({ hist, ...c }) => ({ ...c, hist: (hist || []).map(({ iso, ...h }) => ({ ...h, dias: -diasAte(iso) })) }));
  S.appts = [];
  (dados.appts || []).forEach(({ iso, ...a }) => {
    const d = diasAte(iso);
    if (d >= 0 && d < N_DIAS) S.appts.push({ ...a, d });
    else if (d < 0) {
      // Já passou: entra no histórico da cliente
      const c = a.cid && S.clientes.find((x) => x.id === a.cid), sv = S.servs.find((s) => s.id === a.s);
      if (c) c.hist.push({ dias: -d, s: a.s, p: a.p, valor: sv ? sv.preco : 0, status: a.status, metodo: a.metodo });
    }
  });
  S.sel = null; S.cliSel = null; S.cliEdit = null; S.panel = null;
}
function carregarDados() {
  let dados = null;
  try { dados = JSON.parse(localStorage.getItem(LS_DADOS) || 'null'); } catch (e) { dados = null; }
  if (!dados || dados.v !== 1 || !Array.isArray(dados.appts)) return false;
  aplicarDados(dados); return true;
}

/* ================= MINHA COMISSÃO (profissional) ================= */
function vComissao() {
  const pid = minhaProf(), p = PF[pid];
  const per = S.comPer || 'semana', lim = { hoje: 0, semana: 6, mes: 29 }[per];
  const itens = [];
  S.appts.filter((a) => a.p === pid && a.d === 0 && a.status === 'pago').forEach((a) => itens.push({ q: 0, h: a.h, s: a.s, cliente: a.cliente, valor: valor(a), metodo: a.metodo }));
  S.clientes.forEach((c) => c.hist.forEach((h) => { if (h.p === pid && h.status === 'pago' && h.dias <= lim) itens.push({ q: -h.dias, h: 0, s: h.s, cliente: c.nome, valor: h.valor, metodo: h.metodo }); }));
  itens.sort((a, b) => b.q - a.q || b.h - a.h);
  const pct = (sid) => { const s = SV(sid); return s && s.com != null ? s.com : p.com; };
  const prod = itens.reduce((t, x) => t + x.valor, 0), com = itens.reduce((t, x) => t + x.valor * pct(x.s), 0);

  return `<main>

}

document.addEventListener('click', (e) => {

  else if (a === 'falta') { const x = selA(); x.status = 'faltou'; }
